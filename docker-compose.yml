version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs
    expose:
      - "3000" # expose internally only
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
    command: npm start

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "3000:80"  # expose NGINX to external port 3000
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
